services:
  - type: web
    name: veimen-api
    runtime: docker
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false  # Configurar manualmente en el dashboard de Render
      - key: Jwt__Secret
        sync: false  # Configurar manualmente en el dashboard de Render
      - key: Imap__Username
        sync: false  # Configurar manualmente en el dashboard de Render
      - key: Imap__Password
        sync: false  # Configurar manualmente en el dashboard de Render
