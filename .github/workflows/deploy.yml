name: Deploy .NET 10 to Plesk

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET version
        run: dotnet --version

      - name: Restore
        run: dotnet restore "Veimen API/Veimen API.csproj"

      - name: Publish
        run: |
          dotnet publish "Veimen API/Veimen API.csproj" \
            --configuration Release \
            --output ./publish \
            --no-restore

      - name: Create app_offline.htm
        run: |
          mkdir -p ./offline
          echo "<html><body><h1>Updating application...</h1></body></html>" > ./offline/app_offline.htm

      - name: Put application offline
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET }}
          local-dir: ./offline/

      - name: Wait for IIS
        run: sleep 10

      - name: Deploy application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET }}
          local-dir: ./publish/
          exclude: |
            **/.git*
            **/.git*/**

      - name: Remove app_offline.htm
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET }}
          local-dir: ./empty/
