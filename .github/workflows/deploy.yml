name: Deploy .NET 10 to Plesk

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Obtener código
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ---------------------------------------------------------
      # 2. Instalar .NET 10
      # ---------------------------------------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # ---------------------------------------------------------
      # 3. Verificar .NET
      # ---------------------------------------------------------
      - name: Show .NET version
        run: dotnet --version

      # ---------------------------------------------------------
      # 4. Restore
      # ---------------------------------------------------------
      - name: Restore
        run: |
          dotnet restore "Veimen API/Veimen API.csproj"

      # ---------------------------------------------------------
      # 5. Publish
      # ---------------------------------------------------------
      - name: Publish
        run: |
          dotnet publish "Veimen API/Veimen API.csproj" \
            --configuration Release \
            --output ./publish \
            --no-restore

      # ---------------------------------------------------------
      # 6. Crear app_offline.htm
      # ---------------------------------------------------------
      - name: Create app_offline.htm
        run: |
          echo '<html><head><title>Updating</title></head><body><h1>Application updating...</h1></body></html>' > app_offline.htm

      # ---------------------------------------------------------
      # 7. Subir app_offline.htm usando FTP
      # ---------------------------------------------------------
      - name: Put application offline
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          from ftplib import FTP
          import os

          host = os.environ["FTP_HOST"]
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]

          ftp = FTP(host, timeout=60)
          ftp.login(username, password)
          ftp.cwd("/httpdocs")

          with open("app_offline.htm", "rb") as f:
              ftp.storbinary("STOR app_offline.htm", f)

          ftp.quit()

          print("app_offline.htm uploaded successfully")
          PY

      # ---------------------------------------------------------
      # 8. Esperar a que IIS libere los archivos
      # ---------------------------------------------------------
      - name: Wait for IIS
        run: sleep 15

      # ---------------------------------------------------------
      # 9. Desplegar publicación
      #
      # web.config NO se toca.
      # ---------------------------------------------------------
      - name: Deploy published files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET }}
          local-dir: ./publish/
          exclude: |
            **/web.config
            **/app_offline.htm
            **/.git*
            **/.git*/**

      # ---------------------------------------------------------
      # 10. Eliminar app_offline.htm
      #
      # always() garantiza que se intente ejecutar incluso si
      # el deployment anterior falla.
      # ---------------------------------------------------------
      - name: Bring application back online
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          from ftplib import FTP
          import os

          host = os.environ["FTP_HOST"]
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]

          ftp = FTP(host, timeout=60)
          ftp.login(username, password)
          ftp.cwd("/httpdocs")

          try:
              ftp.delete("app_offline.htm")
              print("app_offline.htm removed successfully")
          except Exception as e:
              print(f"Could not remove app_offline.htm: {e}")
              raise

          ftp.quit()
          PY
